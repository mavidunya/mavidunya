<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mavidunya - Kasa</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#1e3c72,#2a5298);color:#fff;margin:0;padding:15px;min-height:100vh}
.kapsayici{max-width:600px;margin:0 auto}
h1{font-size:1.6em;text-align:center;margin:10px 0}
.geri{background:rgba(255,255,255,0.15);color:#fff;border:none;padding:8px 15px;border-radius:8px;font-size:0.9em;cursor:pointer;margin-bottom:10px}
.bolum{background:rgba(255,255,255,0.08);padding:15px;border-radius:15px;margin-bottom:15px}
.bolum h2{font-size:1.1em;margin:0 0 12px 0;opacity:0.95}
.kasa-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kasa-kutu{background:rgba(255,255,255,0.08);padding:12px;border-radius:10px;text-align:center}
.kasa-kutu .baslik{font-size:0.8em;opacity:0.8;margin-bottom:4px}
.kasa-kutu .tutar{font-size:1.05em;font-weight:bold}
.seri-bilgi{background:rgba(251,191,36,0.2);padding:12px;border-radius:10px;font-size:0.95em}
label{display:block;font-size:0.85em;opacity:0.85;margin:8px 0 4px 0}
input,select{width:100%;padding:10px;border-radius:8px;border:none;font-size:1em;box-sizing:border-box;background:rgba(255,255,255,0.95);color:#000}
.buton{width:100%;padding:12px;border-radius:10px;border:none;font-weight:bold;font-size:1em;cursor:pointer;margin-top:10px}
.btn-yesil{background:#4ade80;color:#064e3b}
.btn-yesil:hover{background:#22c55e}
.btn-mavi{background:#3b82f6;color:#fff}
.btn-mavi:hover{background:#2563eb}
.btn-kirmizi{background:#ef4444;color:#fff}
.btn-kirmizi:hover{background:#dc2626}
.btn-gri{background:#64748b;color:#fff}
.btn-gri:hover{background:#475569}
.islem{background:rgba(255,255,255,0.06);padding:10px;border-radius:10px;margin-bottom:8px;font-size:0.85em}
.islem .satir1{display:flex;justify-content:space-between;margin-bottom:4px}
.islem .mac{font-weight:bold}
.islem .durum{font-size:0.8em;padding:2px 8px;border-radius:10px;display:inline-block}
.durum-bekliyor{background:#fbbf24;color:#000}
.durum-kazandi{background:#4ade80;color:#064e3b}
.durum-kaybetti{background:#ef4444;color:#fff}
.aktif-bahis{background:rgba(251,191,36,0.2);border:1px solid #fbbf24;padding:15px;border-radius:12px;margin-bottom:12px}
.aktif-bahis .mac{font-size:1.1em;font-weight:bold;margin-bottom:5px}
.hata{background:#fbbf24;color:#000;padding:10px;border-radius:10px;margin-top:10px;font-size:0.85em;display:none;word-break:break-word}
.bos{opacity:0.6;text-align:center;padding:15px;font-size:0.9em}
</style>
</head>
<body>
<div class="kapsayici">

<button class="geri" onclick="window.location.href='index.html'">← Ana Sayfa</button>
<h1>💰 Kasa</h1>
<div id="debug" class="hata"></div>

<!-- SERİ BİLGİSİ -->
<div class="bolum" id="seriBolum">
<h2>📊 Aktif Seri</h2>
<div id="seriBilgi" class="seri-bilgi">Yükleniyor...</div>
</div>

<!-- KASA ÖZETİ -->
<div class="bolum">
<h2>💰 Kasa Özeti</h2>
<div class="kasa-grid">
<div class="kasa-kutu"><div class="baslik">💰 Ana Kasa</div><div class="tutar" id="anaKasa">0 TL</div></div>
<div class="kasa-kutu"><div class="baslik">🔒 Yedek Kasa</div><div class="tutar" id="yedekKasa">0 TL</div></div>
<div class="kasa-kutu"><div class="baslik">⚡ Aktif Rolling</div><div class="tutar" id="aktifRolling">0 TL</div></div>
<div class="kasa-kutu"><div class="baslik">🔐 Kilitli Kâr</div><div class="tutar" id="kilitliKar">0 TL</div></div>
</div>
</div>

<!-- TRANSFER -->
<div class="bolum">
<h2>💸 Transfer</h2>
<label>Nereden</label>
<select id="transferNereden">
<option value="ana_kasa">💰 Ana Kasa</option>
<option value="aktif_rolling">⚡ Aktif Rolling</option>
<option value="yedek_kasa">🔒 Yedek Kasa</option>
<option value="kilitli_kar">🔐 Kilitli Kâr</option>
</select>
<label>Nereye</label>
<select id="transferNereye">
<option value="aktif_rolling">⚡ Aktif Rolling</option>
<option value="ana_kasa">💰 Ana Kasa</option>
<option value="yedek_kasa">🔒 Yedek Kasa</option>
<option value="kilitli_kar">🔐 Kilitli Kâr</option>
</select>
<label>Miktar (TL)</label>
<input type="number" id="transferMiktar" placeholder="Örn: 1000">
<button class="buton btn-mavi" onclick="transferYap()">💸 Transfer Et</button>
</div>

<!-- AKTİF BAHİS -->
<div class="bolum" id="aktifBahisBolum" style="display:none">
<h2>🎯 Aktif Bahis</h2>
<div class="aktif-bahis" id="aktifBahisKart"></div>
<button class="buton btn-yesil" onclick="bahisSonuc('kazandi')">✅ Kazandı</button>
<button class="buton btn-kirmizi" onclick="bahisSonuc('kaybetti')">❌ Kaybetti</button>
</div>

<!-- YENİ BAHİS -->
<div class="bolum">
<h2>➕ Yeni Bahis Ekle</h2>
<label>Maç</label>
<input type="text" id="yeniMac" placeholder="Örn: Arsenal vs Chelsea">
<label>Market</label>
<input type="text" id="yeniMarket" placeholder="Örn: Arsenal kazanır">
<label>Oran</label>
<input type="number" id="yeniOran" step="0.01" placeholder="Örn: 1.85">
<label>Tutar (TL)</label>
<input type="number" id="yeniTutar" placeholder="Örn: 1000">
<label>Nereden?</label>
<select id="yeniKaynak">
<option value="aktif_rolling">⚡ Aktif Rolling'den</option>
<option value="ana_kasa">💰 Ana Kasa'dan</option>
</select>
<button class="buton btn-mavi" onclick="bahisEkle()">💾 Bahsi Kaydet</button>
</div>

<!-- SERİYİ TAMAMLA -->
<div class="bolum" id="seriTamamlaBolum" style="display:none">
<h2>🎯 Seriyi Tamamla</h2>
<label>Ana Kasaya Aktarılacak Miktar (TL)</label>
<input type="number" id="seriTransferMiktar" placeholder="Örn: 5000">
<label>Kalan Aktif Rolling'de kalsın mı?</label>
<select id="seriKalanKarar">
<option value="evet">Evet, kalsın</option>
<option value="hayir">Hayır, hepsi ana kasaya</option>
</select>
<button class="buton btn-yesil" onclick="seriTamamla()">✅ Seriyi Tamamla</button>
</div>

<!-- İŞLEM GEÇMİŞİ -->
<div class="bolum">
<h2>📜 İşlem Geçmişi (Son 20)</h2>
<div id="gecmisListe"></div>
<button class="buton btn-gri" onclick="window.location.href='gecmis.html'">📋 Tümünü Gör</button>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* JAVASCRIPT BURAYA GELECEK */
</script>
</body>
</html>
