<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mavidunya</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#1e3c72,#2a5298);color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}
.card{background:rgba(255,255,255,0.1);padding:30px;border-radius:20px;max-width:550px;width:100%}
h1{font-size:2em;margin-bottom:10px;text-align:center}
p{font-size:1.05em;opacity:0.95}
.user-row{display:flex;align-items:center;justify-content:center;gap:12px;margin:15px 0}
.dot{width:18px;height:18px;border-radius:50%;display:inline-block;border:3px solid #fff;background:#888}
.dot.blue{background:#3b82f6;box-shadow:0 0 10px rgba(255,255,255,0.8),0 0 0 2px rgba(255,255,255,0.4)}
.badge{display:inline-block;background:#4ade80;color:#064e3b;padding:5px 15px;border-radius:20px;font-weight:bold;font-size:0.85em}
.hedef{text-align:center;margin:20px 0 10px 0;font-size:1.15em}
.hedef .rakam{font-size:1.6em;font-weight:bold;color:#4ade80;display:block;margin-top:5px}
.ilerleme{width:100%;height:20px;background:rgba(255,255,255,0.15);border-radius:10px;overflow:hidden;margin:10px 0 5px 0}
.ilerleme-bar{height:100%;background:linear-gradient(90deg,#4ade80,#22c55e);border-radius:10px;transition:width 0.5s;width:0%}
.yuzde{text-align:center;font-size:0.9em;opacity:0.85;margin-bottom:15px}
.kasa-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}
.kasa-kutu{background:rgba(255,255,255,0.08);padding:15px;border-radius:12px;text-align:center}
.kasa-kutu .baslik{font-size:0.85em;opacity:0.8;margin-bottom:5px}
.kasa-kutu .tutar{font-size:1.2em;font-weight:bold}
.butonlar{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.butonlar button{flex:1;min-width:calc(50% - 4px);padding:12px;border-radius:10px;border:none;font-weight:bold;font-size:0.95em;cursor:pointer}
.btn-kasa{background:#3b82f6;color:#fff}
.btn-kasa:hover{background:#2563eb}
.btn-istatistik{background:#8b5cf6;color:#fff}
.btn-istatistik:hover{background:#7c3aed}
.btn-bulten{background:#0ea5e9;color:#fff}
.btn-bulten:hover{background:#0284c7}
.btn-tahmin{background:#8b5cf6;color:#fff}
.btn-kombine{background:#f59e0b;color:#fff}
.btn-kombine:hover{background:#d97706}
.btn-tahmin:hover{background:#7c3aed}
.btn-ayar{background:#64748b;color:#fff}
.btn-ayar:hover{background:#475569}
.btn-cikis{background:#ef4444;color:#fff}
.btn-cikis:hover{background:#dc2626}
.hata{background:#fbbf24;color:#000;padding:10px;border-radius:10px;margin-top:15px;font-size:0.85em;display:none;word-break:break-word}
</style>
</head>
<body>

<div class="card">
    <!-- KASA SEÇİM BUTONU (Sağ Üst Köşe) -->
<div id="kasaGecisPaneli" style="display: none; position: absolute; top: 20px; right: 20px; z-index: 100;">
    <button onclick="menuAcKapa()" style="background: #f59e0b; color: white; padding: 8px 15px; border: none; border-radius: 8px; font-size: 0.85em; font-weight: bold; cursor: pointer;">
        💰 <span id="aktifKasaAdi">Ortak Kasa</span> ▼
    </button>
    <div id="kasaMenuListesi" style="display: none; position: absolute; top: 100%; right: 0; background: #1e3c72; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; width: 150px; z-index: 100; margin-top: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
        <!-- Seçenekler buraya JavaScript ile gelecek -->
    </div>
</div>
<h1>🌊 Mavidunya</h1>
<div class="user-row">
<span class="dot" id="userDot"></span>
<p id="hosgeldin" style="margin:0">Yükleniyor...</p>
</div>
<div style="text-align:center"><span class="badge">✅ Sistem çalışıyor</span></div>

<div class="hedef">
🎯 Hedef Kazanç
<span class="rakam" id="hedefRakam">0 TL</span>
</div>
    <div class="hedef" style="margin-top: 5px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;">
    🏦 Toplam Varlık
    <span class="rakam" id="toplamVarlik" style="color:#4ade80;">0 TL</span>
</div>
<div class="ilerleme"><div class="ilerleme-bar" id="ilerlemeBar"></div></div>
<div class="yuzde" id="yuzde">%0 tamamlandı</div>


<div id="debug" class="hata"></div>

<div class="butonlar">
<button class="btn-bulten" onclick="window.location.href='bulten.html'">🌍 Bülten</button>
<button class="btn-kombine" onclick="window.location.href='kombine.html'">🎯 Kombine</button>
<button class="btn-tahmin" onclick="window.location.href='tahmin.html'">🤖 Tahmin</button>
<button class="btn-kasa" onclick="window.location.href='kasa.html'">💰 Kasa</button>
<button class="btn-istatistik" onclick="window.location.href='istatistik.html'">📊 İstatistik</button>
<button class="btn-ayar" onclick="window.location.href='ayarlar.html'">⚙️ Ayarlar</button>
<button class="btn-cikis" onclick="cikisYap()">🚪 Çıkış</button>
</div>
</div>

  return new Intl.NumberFormat('tr-TR', {maximumFractionDigits: 0}).format(n) + " TL";

async function kontrol() {
  try {
    const { data: { session } } = await client.auth.getSession();
    if (!session) { window.location.href = "login.html"; return; }
    mevcutKullanici = session.user.id;

    // Profil bilgisini çek (hatayı yakalamak için limit(1) kullanıyoruz)
    const { data: profilListesi, error: profilHata } = await client.from("profiles").select("display_name, rol").eq("auth_id", session.user.id).limit(1);
    
    // Eğer veritabanı hatası varsa ekrana yazdır
    if (profilHata) { 
      document.getElementById("hosgeldin").textContent = "Veritabanı Hatası: " + profilHata.message; 
      return; 
    }

    // Profil bulunduysa devam et
    if (profilListesi && profilListesi.length > 0) {
      const profil = profilListesi[0];
      document.getElementById("hosgeldin").textContent = "Hoş geldin, " + profil.display_name;
      
      // Admin kontrolü
    if (profil.rol === "admin") {
      document.getElementById("kasaGecisPaneli").style.display = "block";
      await kasaMenuDoldur();
      await kasaYukle('ortak');
    } else {
      document.getElementById("kasaGecisPaneli").style.display = "none";
      await kasaYukle('kisisel');
    }
    } else {
      document.getElementById("hosgeldin").textContent = "Profil bulunamadı!";
    }
  } catch (e) {
    document.getElementById("hosgeldin").textContent = "Kod Hatası: " + e.message;
  }
}

async function cikisYap() {
  await client.auth.signOut();
  window.location.href = "login.html";
}
// Menüyü Aç/Kapa
function menuAcKapa() {
  const menu = document.getElementById("kasaMenuListesi");
  menu.style.display = menu.style.display === "none" ? "block" : "none";
}

// Kasaları Veritabanından Çek ve Menüye Ekle
async function kasaMenuDoldur() {
  const { data: kasalar, error } = await client.from("kasalar").select("*");
  if (error || !kasalar) return;
  
  const menu = document.getElementById("kasaMenuListesi");
  menu.innerHTML = ""; // İçini temizle

  kasalar.forEach(kasa => {
    const secenek = document.createElement("div");
    secenek.textContent = kasa.kasa_adi;
    secenek.style.cssText = "padding: 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.1); font-weight: bold; color: white; text-align: left;";
    
    // Üzerine gelince renk değişsin
    secenek.onmouseover = () => secenek.style.background = "rgba(255,255,255,0.1)";
    secenek.onmouseout = () => secenek.style.background = "transparent";
    
    // Tıklandığında o kasayı yükle ve buton adını değiştir
    secenek.onclick = () => {
        document.getElementById("aktifKasaAdi").textContent = kasa.kasa_adi;
        kasaYukle(kasa.kasa_adi); 
    };
    
    menu.appendChild(secenek);
  });
}

  // Şimdilik sadece test edelim
}

</script>
</body>
</html>
