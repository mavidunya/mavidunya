<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mavidunya</title>
  <style>
    <script src="app.js"></script>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.1);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      max-width: 500px;
    }
    h1 { font-size: 2.5em; margin-bottom: 10px; }
    p { font-size: 1.1em; opacity: 0.9; }
    .badge {
      display: inline-block;
      background: #4ade80;
      color: #064e3b;
      padding: 5px 15px;
      border-radius: 20px;
      font-weight: bold;
      margin-top: 20px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌊 Mavidunya</h1>
    <p>Futbol analiz ve rolling takip sistemi</p>
    <p>Hasan & Hakan — ortak çalışma alanı</p>
    <div class="badge">✅ Sistem çalışıyor</div>
  </div>
</body>
</html>
