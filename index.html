<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mavidunya</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#1e3c72,#2a5298);color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;text-align:center;padding:20px}
.card{background:rgba(255,255,255,0.1);padding:40px;border-radius:20px;max-width:500px;width:100%}
h1{font-size:2.5em;margin-bottom:10px}
p{font-size:1.1em;opacity:0.9}
.user-row{display:flex;align-items:center;justify-content:center;gap:12px;margin:20px 0}
.dot{width:18px;height:18px;border-radius:50%;display:inline-block;border:2px solid #fff;background:#888}
.badge{display:inline-block;background:#4ade80;color:#064e3b;padding:5px 15px;border-radius:20px;font-weight:bold;margin-top:20px;font-size:0.9em}
button{margin-top:20px;padding:10px 20px;border-radius:10px;border:none;background:#ef4444;color:#fff;font-weight:bold;cursor:pointer;font-size:1em}
.hata{background:#fbbf24;color:#000;padding:10px;border-radius:10px;margin-top:15px;font-size:0.85em;text-align:left;word-break:break-word}
</style>
</head>
<body>
<div class="card">
<h1>🌊 Mavidunya</h1>
<div class="user-row">
<span class="dot" id="userDot"></span>
<p id="hosgeldin" style="margin:0">Yükleniyor...</p>
</div>
<div class="badge">✅ Sistem çalışıyor</div>
<div id="debug" class="hata" style="display:none"></div>
<br>
<button onclick="cikisYap()">Çıkış Yap</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://bwdoiltmkrqfxqknedih.supabase.co";
const SUPABASE_KEY = "sb_publishable_CLFNEIDYCLTMIHOQ1onzmq_EEwz5_UF";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function hataGoster(msg) {
  const el = document.getElementById("debug");
  el.style.display = "block";
  el.textContent = "DEBUG: " + msg;
}

async function kontrol() {
  try {
    const { data: { session }, error: sessErr } = await client.auth.getSession();
    if (sessErr) { hataGoster("Session hatasi: " + sessErr.message); return; }
    if (!session) { window.location.href = "login.html"; return; }
    const email = session.user.email;

    const { data: profil, error: pErr } = await client
      .from("profiles")
      .select("display_name, avatar_color")
      .eq("email", email)
      .maybeSingle();

    if (pErr) { hataGoster("Profil hatasi: " + pErr.message + " | kod: " + pErr.code); return; }

    if (profil) {
      document.getElementById("hosgeldin").textContent = "Hos geldin, " + profil.display_name;
      const dot = document.getElementById("userDot");
      if (profil.avatar_color === "blue") dot.style.background = "#3b82f6";
      else if (profil.avatar_color === "green") dot.style.background = "#22c55e";
    } else {
      hataGoster("Profil bulunamadi. Email: " + email);
      document.getElementById("hosgeldin").textContent = "Hos geldin, " + email;
    }
  } catch (e) {
    hataGoster("Genel hata: " + e.message);
  }
}

async function cikisYap() {
  await client.auth.signOut();
  window.location.href = "login.html";
}

kontrol();
</script>
</body>
</html>
