<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mavidunya</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#1e3c72,#2a5298);color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;text-align:center;padding:20px}
.card{background:rgba(255,255,255,0.1);padding:40px;border-radius:20px;max-width:500px}
h1{font-size:2.5em;margin-bottom:10px}
p{font-size:1.1em;opacity:0.9}
.badge{display:inline-block;background:#4ade80;color:#064e3b;padding:5px 15px;border-radius:20px;font-weight:bold;margin-top:20px;font-size:0.9em}
</style>
</head>
<body>
<div class="card">
<h1>🌊 Mavidunya</h1>
<p id="hosgeldin">Yükleniyor...</p>
<div class="badge">✅ Sistem çalışıyor</div>
<button onclick="cikisYap()" style="margin-top:20px;padding:10px 20px;border-radius:10px;border:none;background:#ef4444;color:#fff;font-weight:bold;cursor:pointer">Çıkış Yap</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://bwdoiltmkrqfxqknedih.supabase.co";
const SUPABASE_KEY = "sb_publishable_CLFNEIDYCLTMIHOQ1onzmq_EEwz5_UF";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function kontrol() {
  const { data: { session } } = await client.auth.getSession();
  if (!session) {
    window.location.href = "login.html";
    return;
  }
  const email = session.user.email;
  document.getElementById("hosgeldin").textContent = "Hoş geldin, " + email;
}

async function cikisYap() {
  await client.auth.signOut();
  window.location.href = "login.html";
}

kontrol();
</script>
</body>
</html>
