<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mavidunya</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#1e3c72,#2a5298);color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}
.card{background:rgba(255,255,255,0.1);padding:30px;border-radius:20px;max-width:550px;width:100%;position:relative}
h1{font-size:2em;margin-bottom:10px;text-align:center}
p{font-size:1.05em;opacity:0.95}
.user-row{display:flex;align-items:center;justify-content:center;gap:12px;margin:15px 0}
.dot{width:18px;height:18px;border-radius:50%;display:inline-block;border:3px solid #fff;background:#888}
.dot.blue{background:#3b82f6;box-shadow:0 0 10px rgba(255,255,255,0.8),0 0 0 2px rgba(255,255,255,0.4)}
.badge{display:inline-block;background:#4ade80;color:#064e3b;padding:5px 15px;border-radius:20px;font-weight:bold;font-size:0.85em}
.hedef{text-align:center;margin:20px 0 10px 0;font-size:1.15em}
.hedef .rakam{font-size:1.6em;font-weight:bold;color:#4ade80;display:block;margin-top:5px}
.ilerleme{width:100%;height:20px;background:rgba(255,255,255,0.15);border-radius:10px;overflow:hidden;margin:10px 0 5px 0}
.ilerleme-bar{height:100%;background:linear-gradient(90deg,#4ade80,#22c55e);border-radius:10px;transition:width 0.5s;width:0%}
.yuzde{text-align:center;font-size:0.9em;opacity:0.85;margin-bottom:15px}
.butonlar{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.butonlar button{flex:1;min-width:calc(50% - 4px);padding:12px;border-radius:10px;border:none;font-weight:bold;font-size:0.95em;cursor:pointer}
.btn-kasa{background:#3b82f6;color:#fff}
.btn-kasa:hover{background:#2563eb}
.btn-istatistik{background:#8b5cf6;color:#fff}
.btn-istatistik:hover{background:#7c3aed}
.btn-bulten{background:#0ea5e9;color:#fff}
.btn-bulten:hover{background:#0284c7}
.btn-tahmin{background:#8b5cf6;color:#fff}
.btn-kombine{background:#f59e0b;color:#fff}
.btn-kombine:hover{background:#d97706}
.btn-tahmin:hover{background:#7c3aed}
.btn-ayar{background:#64748b;color:#fff}
.btn-ayar:hover{background:#475569}
.btn-cikis{background:#ef4444;color:#fff}
.btn-cikis:hover{background:#dc2626}
.hata{background:#fbbf24;color:#000;padding:10px;border-radius:10px;margin-top:15px;font-size:0.85em;display:none;word-break:break-word}
</style>
</head>
<body>

<div class="card">
    <div id="kasaGecisPaneli" style="display: none; position: absolute; top: 20px; right: 20px; z-index: 100;">
        <button onclick="menuAcKapa()" style="background: #f59e0b; color: white; padding: 8px 15px; border: none; border-radius: 8px; font-size: 0.85em; font-weight: bold; cursor: pointer;">
            💰 <span id="aktifKasaAdi">Ortak Kasa</span> ▼
        </button>
        <div id="kasaMenuListesi" style="display: none; position: absolute; top: 100%; right: 0; background: #111827; border: 1px solid #f59e0b; border-radius: 8px; width: 180px; z-index: 9999; margin-top: 8px; box-shadow: 0 10px 15px rgba(0,0,0,0.5);">
        </div>
    </div>

    <h1>🌊 Mavidunya</h1>
    <div class="user-row">
        <span class="dot" id="userDot"></span>
        <p id="hosgeldin" style="margin:0">Yükleniyor...</p>
    </div>
    <div style="text-align:center"><span class="badge">✅ Sistem çalışıyor</span></div>

    <div class="hedef">
        🎯 Hedef Kazanç
        <span class="rakam" id="hedefRakam">0 TL</span>
    </div>
    
    <div class="hedef" style="margin-top: 5px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;">
        🏦 Toplam Varlık
        <span class="rakam" id="toplamVarlik" style="color:#4ade80;">0 TL</span>
    </div>

    <div class="ilerleme"><div class="ilerleme-bar" id="ilerlemeBar"></div></div>
    <div class="yuzde" id="yuzde">%0 tamamlandı</div>

    <div id="debug" class="hata"></div>

    <div class="butonlar">
        <button class="btn-bulten" onclick="window.location.href='bulten.html'">🌍 Bülten</button>
        <button class="btn-kombine" onclick="window.location.href='kombine.html'">🎯 Kombine</button>
        <button class="btn-tahmin" onclick="window.location.href='tahmin.html'">🤖 Tahmin</button>
        <button class="btn-kasa" onclick="kasayaGit()">💰 Kasa</button>
        <button class="btn-istatistik" onclick="window.location.href='istatistik.html'">📊 İstatistik</button>
        <button class="btn-ayar" onclick="window.location.href='ayarlar.html'">⚙️ Ayarlar</button>
        <button class="btn-cikis" onclick="cikisYap()">🚪 Çıkış</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://bwdoiltmkrqfxqknedih.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ3ZG9pbHRta3JxZnhxa25lZGloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NTkzNjcsImV4cCI6MjEwNjAzNTM2N30.mx1O66LItD6Q6ED1Z75YzGXW7ijSDUVAl9R2df4Km8o";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let mevcutKullanici = null;
let aktifKasaId = null;
let aktifKasaTipi = null;
let kendiKasaId = null;

function tlFormat(n) {
  return new Intl.NumberFormat('tr-TR', {maximumFractionDigits: 0}).format(n) + " TL";
}

function menuAcKapa() {
  const menu = document.getElementById("kasaMenuListesi");
  menu.style.display = menu.style.display === "none" ? "block" : "none";
}

function seciliKasayiKaydet(kasa) {
  const kasaId = typeof kasa === "string" ? kasa : kasa?.id;
  const kasaTipi = typeof kasa === "object" ? (kasa?.kasa_tipi || null) : aktifKasaTipi;
  aktifKasaId = kasaId || null;
  aktifKasaTipi = kasaTipi;
  if (kasaId) {
    localStorage.setItem("secili_kasa_id", kasaId);
    localStorage.setItem("aktif_kasa_id", kasaId);
  }
  if (kasaTipi) {
    localStorage.setItem("secili_kasa_tipi", kasaTipi);
  } else {
    localStorage.removeItem("secili_kasa_tipi");
  }
}

function kasayaGit() {
  const hedefKasa = aktifKasaId || localStorage.getItem("secili_kasa_id") || kendiKasaId;
  if (hedefKasa) {
    localStorage.setItem("secili_kasa_id", hedefKasa);
    localStorage.setItem("aktif_kasa_id", hedefKasa);
    window.location.href = "kasa.html?kasa_id=" + encodeURIComponent(hedefKasa);
  } else {
    window.location.href = "kasa.html";
  }
}

function izlemeDurumuGuncelle(kasa) {
  const debugEl = document.getElementById("debug");
  if (!kasa) return;

  // Ortak kasa veya kullanıcının kendi kasası her zaman müdahaleye açıktır
  const ortakKasaMi = kasa.kasa_tipi === "ortak";
  const kendiKasasiMi = Boolean(kendiKasaId && kasa.id === kendiKasaId);

  if (!ortakKasaMi && !kendiKasasiMi) {
    debugEl.style.display = "block";
    debugEl.textContent = "👁️ İzleme Modu: '" + kasa.kasa_adi + "' kasası inceleniyor (müdahale kapalı).";
  } else {
    debugEl.style.display = "none";
    debugEl.textContent = "";
  }
}

async function kontrol() {
  try {
    const { data: { session } } = await client.auth.getSession();
    if (!session) { window.location.href = "login.html"; return; }
    mevcutKullanici = session.user.id;

    const { data: profilListesi, error: profilHata } = await client
      .from("profiles")
      .select("*")
      .eq("auth_id", session.user.id)
      .limit(1);

    if (profilHata || !profilListesi || profilListesi.length === 0) {
      document.getElementById("hosgeldin").textContent = "Profil bulunamadı!";
      return;
    }

    const profil = profilListesi[0];
    kendiKasaId = profil.kasa_id || null;
    const ad = profil.display_name || profil.ekran_adi || "Kullanıcı";
    document.getElementById("hosgeldin").textContent = "Hoş geldin, " + ad;
    document.getElementById("userDot").classList.add("blue");

    const yetkiliYonetici = profil.rol === "yönetici" || profil.rol === "admin";

    if (yetkiliYonetici) {
      document.getElementById("kasaGecisPaneli").style.display = "block";

      const { data: kasalar, error: kasaHata } = await client.from("kasalar").select("*");
      if (kasaHata) {
        document.getElementById("debug").style.display = "block";
        document.getElementById("debug").textContent = "Kasa okuma hatası: " + kasaHata.message;
        return;
      }

      const menu = document.getElementById("kasaMenuListesi");
      menu.innerHTML = "";

      if (kasalar && kasalar.length > 0) {
        kasalar.forEach(kasa => {
          const secenek = document.createElement("div");
          secenek.textContent = kasa.kasa_adi;
          secenek.style.cssText = "padding: 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.1); font-weight: bold; color: white; text-align: left;";
          secenek.onclick = async () => {
            document.getElementById("aktifKasaAdi").textContent = kasa.kasa_adi;
            seciliKasayiKaydet(kasa);
            izlemeDurumuGuncelle(kasa);
            await kasaYukle(kasa);
            menuAcKapa();
          };
          menu.appendChild(secenek);
        });

        const ortakKasa = kasalar.find(k => k.kasa_tipi === "ortak") || kasalar[0];
        document.getElementById("aktifKasaAdi").textContent = ortakKasa.kasa_adi;
        seciliKasayiKaydet(ortakKasa);
        izlemeDurumuGuncelle(ortakKasa);
        await kasaYukle(ortakKasa);
      } else {
        document.getElementById("aktifKasaAdi").textContent = "Kasa Bulunamadı";
        document.getElementById("debug").style.display = "block";
        document.getElementById("debug").textContent = "Veritabanında hiç kasa tanımlanmamış.";
      }
    } else {
      document.getElementById("kasaGecisPaneli").style.display = "none";

      if (profil.kasa_id) {
        const { data: kasaBilgi } = await client
          .from("kasalar")
          .select("*")
          .eq("id", profil.kasa_id)
          .maybeSingle();
        seciliKasayiKaydet(kasaBilgi || profil.kasa_id);
        if (kasaBilgi?.kasa_adi) {
          document.getElementById("aktifKasaAdi").textContent = kasaBilgi.kasa_adi;
        }
        izlemeDurumuGuncelle(kasaBilgi || { id: profil.kasa_id, kasa_tipi: "kisisel", kasa_adi: "Kişisel Kasa" });
        await kasaYukle(kasaBilgi || profil.kasa_id);
      }
    }
  } catch (e) {
    document.getElementById("debug").style.display = "block";
    document.getElementById("debug").textContent = "Kod Hatası: " + e.message;
  }
}

async function kasaYukle(kasaOrId) {
  const kasaId = typeof kasaOrId === "string" ? kasaOrId : kasaOrId?.id;
  const kasaTipi = typeof kasaOrId === "object" ? kasaOrId?.kasa_tipi : aktifKasaTipi;
  if (!kasaId) return;

  let { data: ayar } = await client
    .from("ayarlar")
    .select("*")
    .eq("kasa_id", kasaId)
    .maybeSingle();

  // Ortak kasada kasa_id eşleşmezse fallback olarak ortak ayar satırını dene
  if (!ayar && kasaTipi === "ortak") {
    const { data: ortakAyar } = await client
      .from("ayarlar")
      .select("*")
      .eq("kasa_tipi", "ortak")
      .limit(1)
      .maybeSingle();
    if (ortakAyar) ayar = ortakAyar;
  }

  if (ayar) {
    const hedefDeger = parseFloat(ayar.hedef ?? ayar.hedef_kazanc ?? 0) || 0;
    const ana = parseFloat(ayar.ana_kasa) || 0;
    const yedek = parseFloat(ayar.yedek_kasa) || 0;
    const aktif = parseFloat(ayar.aktif_rolling) || 0;
    const kilit = parseFloat(ayar.kilitli_kar) || 0;
    const toplam = ana + yedek + aktif + kilit;

    document.getElementById("hedefRakam").textContent = tlFormat(hedefDeger);
    document.getElementById("toplamVarlik").textContent = tlFormat(toplam);

    const yuzde = hedefDeger > 0 ? Math.min(100, (toplam / hedefDeger) * 100) : 0;
    document.getElementById("ilerlemeBar").style.width = yuzde + "%";
    document.getElementById("yuzde").textContent = "%" + yuzde.toFixed(2) + " tamamlandı";
  } else {
    document.getElementById("hedefRakam").textContent = "0 TL";
    document.getElementById("toplamVarlik").textContent = "0 TL";
    document.getElementById("ilerlemeBar").style.width = "0%";
    document.getElementById("yuzde").textContent = "%0 tamamlandı";
  }
}

async function cikisYap() {
  localStorage.removeItem("secili_kasa_id");
  localStorage.removeItem("aktif_kasa_id");
  localStorage.removeItem("secili_kasa_tipi");
  await client.auth.signOut();
  window.location.href = "login.html";
}

kontrol();
</script>
</body>
</html>
