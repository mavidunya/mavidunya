async function footballFikstur(macSayisi, tarih) {
  // football-data.org'dan maç listesi çek
  if (!aiAnahtarlari.football) {
    throw new Error("Football-data anahtarı yok.");
  }

  // Ücretsiz katmanda izin verilen ligler
  const ligler = ["PL", "PD", "SA", "BL1", "FL1", "DED", "PPL", "CL"];
  
  const tarihObj = new Date(tarih.split(".").reverse().join("-"));
  const tarihStr = tarihObj.toISOString().split("T")[0];
  const tarihSonraki = new Date(tarihObj);
  tarihSonraki.setDate(tarihSonraki.getDate() + 1);
  const tarihSonrakiStr = tarihSonraki.toISOString().split("T")[0];

  const tumMaclar = [];

  for (const lig of ligler) {
    try {
      const url = "https://api.football-data.org/v4/competitions/" + lig + "/matches?dateFrom=" + tarihStr + "&dateTo=" + tarihSonrakiStr;
      const r = await fetch(url, {
        headers: { "X-Auth-Token": aiAnahtarlari.football }
      });
      if (!r.ok) continue;
      const data = await r.json();
      if (data.matches && Array.isArray(data.matches)) {
        for (const m of data.matches) {
          tumMaclar.push({
            ev_sahibi: m.homeTeam?.name || "?",
            deplasman: m.awayTeam?.name || "?",
            lig: data.competition?.name || lig,
            saat: m.utcDate ? new Date(m.utcDate).toLocaleTimeString('tr-TR', {hour:'2-digit',minute:'2-digit'}) : "?",
            tarih: m.utcDate
          });
        }
      }
      // Rate limit: 10 istek/dakika
      await new Promise(res => setTimeout(res, 6500));
    } catch (e) {
      console.warn("Lig " + lig + " hata:", e.message);
    }
  }

  // Maçları sırala ve sınırla
  tumMaclar.sort((a, b) => new Date(a.tarih) - new Date(b.tarih));
  return tumMaclar.slice(0, macSayisi);
}
  
async function geminiCagir(prompt) {
  const modeller = ["gemini-flash-latest", "gemini-2.5-flash", "gemini-2.0-flash"];
  const body = {
    contents: [{ parts: [{ text: prompt }] }],
    tools: [{ google_search: {} }],
    generationConfig: { temperature: 0.7, maxOutputTokens: 8192 }
  };

  for (const model of modeller) {
    for (let deneme = 1; deneme <= 2; deneme++) {
      try {
        const url = "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent?key=" + aiAnahtarlari.gemini;
        const r = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        if (r.ok) {
          const data = await r.json();
          const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
          if (text) return text;
        }
        const kod = r.status;
        if (kod === 503 || kod === 429 || kod === 404) {
          if (deneme < 2) { await new Promise(res => setTimeout(res, 3000)); continue; }
          break;
        }
        const errText = await r.text();
        throw new Error("Gemini (" + model + "): " + kod + " - " + errText.substring(0, 150));
      } catch (e) {
        if (deneme === 2) break;
        await new Promise(res => setTimeout(res, 3000));
      }
    }
  }
  throw new Error("Tüm Gemini modelleri yoğun.");
}

function jsonCikar(text) {
  try {
    const match = text.match(/\{[\s\S]*\}/);
    let parsed = match ? JSON.parse(match[0]) : JSON.parse(text);
    if (parsed && parsed.maclar && Array.isArray(parsed.maclar)) {
      parsed.maclar = parsed.maclar.map(m => {
        const ajanlar = m.ajanlar || {};
        const normAjan = {};
        ["poisson", "elo", "form", "taktik"].forEach(a => {
          const src = ajanlar[a] || {};
          normAjan[a] = {
            market: src.market || src.piyasa || "?",
            guven: parseFloat(src.guven ?? src.confidence ?? 0) || 0,
            gerekce: src.gerekce || src.gerekçe || src.reason || ""
          };
        });
        return {
          ev_sahibi: m.ev_sahibi || "?",
          deplasman: m.deplasman || "?",
          lig: m.lig || "?",
          saat: m.saat || "?",
          ajanlar: normAjan,
          ortak_karar: m.ortak_karar || "?",
          guven: parseFloat(m.guven ?? m.confidence ?? 0) || 0,
          durum: m.durum || "normal"
        };
      });
    }
    return parsed;
  } catch (e) {
    return null;
  }
}

// ÖNCE: football-data.org'dan fikstür çek
document.getElementById("ilerlemeMetin").textContent = "Football-data'dan maçlar çekiliyor...";
document.getElementById("ilerlemeDetay").textContent = "Bu işlem 1-2 dakika sürebilir";

  document.getElementById("ilerlemeBolum").style.display = "none";
  document.getElementById("analizBtn").disabled = false;

}
  
  document.getElementById("ilerlemeBolum").style.display = "block";
  document.getElementById("filtreBolum").style.display = "none";
  document.getElementById("sonucBolum").style.display = "none";
  document.getElementById("analizBtn").disabled = true;

  tumKartlar = [];
  let hataVar = false;
for (let g = 0; g < toplamGrup; g++) {
  
  const baslangic = g * grupBoyut;
const bitis = Math.min(baslangic + grupBoyut, macListesi.length);
const grupMaclar = macListesi.slice(baslangic, bitis);
    const ilerleme = ((g) / toplamGrup) * 100;
    document.getElementById("ilerlemeDolgu").style.width = ilerleme + "%";
    document.getElementById("ilerlemeMetin").textContent = "Grup " + (g + 1) + "/" + toplamGrup + " analiz ediliyor...";
    document.getElementById("ilerlemeDetay").textContent = "Bu grupta " + grupMaclar.length + " maç";

    const prompt = promptOlustur(tarih, grupMaclar, g + 1, toplamGrup);

    try {
      const yanit = await geminiCagir(prompt);
      const json = jsonCikar(yanit);
      if (json && json.maclar) {
        tumKartlar = tumKartlar.concat(json.maclar);
      } else {
        hataGoster("Grup " + (g + 1) + " JSON parse edilemedi.");
      }
    } catch (e) {
      hataGoster("Grup " + (g + 1) + " hata: " + e.message);
      hataVar = true;
      break;
    }
  }

  document.getElementById("ilerlemeDolgu").style.width = "100%";
  document.getElementById("ilerlemeMetin").textContent = "Tamamlandı!";
  document.getElementById("analizBtn").disabled = false;

  if (tumKartlar.length > 0) {
    kartlariGoster();
    document.getElementById("filtreBolum").style.display = "block";
    document.getElementById("sonucBolum").style.display = "block";
    document.getElementById("sonucSayisi").textContent = tumKartlar.length;
    await analizKaydet(tarih, macSayisi);
    await sonAnalizleriYukle();
  } else {
    hataGoster("Hiç maç analiz edilemedi.");
  }

  setTimeout(() => {
    document.getElementById("ilerlemeBolum").style.display = "none";
  }, 2000);
}

function kartlariGoster() {
  const filtreOne = document.getElementById("filtreOneCikan").checked;
  const minGuven = parseFloat(document.getElementById("minGuven").value) || 0;
  document.getElementById("sliderDeger").textContent = minGuven;

  let gosterilecek = tumKartlar.filter(m => {
    if (filtreOne && m.durum !== "one_cikan") return false;
    if (m.guven < minGuven) return false;
    return true;
  });

  const el = document.getElementById("kartListesi");
  if (gosterilecek.length === 0) {
    el.innerHTML = '<div class="bos">Filtrelere uygun maç yok.</div>';
    return;
  }

  el.innerHTML = gosterilecek.map(m => {
    const durumEtiket = m.durum === "one_cikan" ? "🎯 ÖNE ÇIKAN" : (m.durum === "normal" ? "⚡ Normal" : "❌ Değersiz");
    const ajanlar = m.ajanlar || {};
    const ajanSatirlari = ["poisson", "elo", "form", "taktik"].map(a => {
      const isim = {poisson:"📊 Poisson", elo:"📈 Elo", form:"🔥 Form", taktik:"🎭 Taktik"}[a];
      const aj = ajanlar[a] || {};
      return '<div class="ajan-satir">' +
        '<span class="ajan-adi">' + isim + '</span>' +
        '<span class="ajan-tahmin">' + (aj.market || "-") + '</span>' +
        '<span class="ajan-guven">%' + (aj.guven || 0) + '</span>' +
        '</div>' +
        (aj.gerekce ? '<div class="gerekce">' + aj.gerekce + '</div>' : '');
    }).join("");

    return '<div class="kart ' + (m.durum || "normal") + '">' +
      '<div class="baslik">' +
      '<div><div class="mac">' + m.ev_sahibi + ' - ' + m.deplasman + '</div>' +
      '<div class="lig">' + m.lig + ' | ' + (m.saat || "") + '</div></div>' +
      '<span class="durum-etiket">' + durumEtiket + '</span>' +
      '</div>' +
      ajanSatirlari +
      '<div class="ortak"><strong>Ortak Karar:</strong> ' + m.ortak_karar + ' (%' + m.guven + ')</div>' +
      '</div>';
  }).join("");
}

function kartlariFiltrele() {
  kartlariGoster();
}

function sonuclariTemizle() {
  tumKartlar = [];
  document.getElementById("filtreBolum").style.display = "none";
  document.getElementById("sonucBolum").style.display = "none";
  basariGoster("Sonuçlar temizlendi.");
}

async function analizKaydet(tarih, macSayisi) {
  const oneCikan = tumKartlar.filter(m => m.durum === "one_cikan").length;
  const normal = tumKartlar.filter(m => m.durum === "normal").length;
  const degersiz = tumKartlar.filter(m => m.durum === "degersiz").length;

  const ozet = oneCikan + " öne çıkan, " + normal + " normal, " + degersiz + " değersiz";

  const { error } = await client.from("bulten_analizleri").insert({
    hedef_tarih: tarih.split(".").reverse().join("-"),
    mac_sayisi: tumKartlar.length,
    one_cikan_sayisi: oneCikan,
    normal_sayisi: normal,
    degersiz_sayisi: degersiz,
    ai_model: "gemini",
    ham_yanit: JSON.stringify(tumKartlar),
    ozet: ozet,
    created_by: mevcutKullanici
  });

  if (error) { hataGoster("Kayıt hatası: " + error.message); return; }
  basariGoster("Analiz kaydedildi: " + ozet);
}

async function sonAnalizleriYukle() {
  const { data, error } = await client.from("bulten_analizleri")
    .select("*")
    .order("created_at", { ascending: false })
    .limit(5);

  if (error) { hataGoster("Son analizler: " + error.message); return; }

  const el = document.getElementById("sonAnalizler");
  if (!data || data.length === 0) {
    el.innerHTML = '<div class="bos">Henüz analiz yok.</div>';
    return;
  }

  el.innerHTML = data.map(a => {
    const tarih = new Date(a.created_at).toLocaleString('tr-TR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    return '<div class="son-analiz">' +
      '<div class="tarih">' + tarih + ' | Hedef: ' + (a.hedef_tarih || "-") + '</div>' +
      '<div class="ozet">' + (a.ozet || "-") + '</div>' +
      '</div>';
  }).join("");
}

kontrol();
</script>
