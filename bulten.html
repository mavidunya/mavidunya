<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mavidunya - Bülten Analizi</title>
  <style>
    body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#1e3c72,#2a5298);color:#fff;margin:0;padding:15px;min-height:100vh}
    .kapsayici{max-width:650px;margin:0 auto}
    h1{font-size:1.6em;text-align:center;margin:10px 0}
    .geri{background:rgba(255,255,255,0.15);color:#fff;border:none;padding:8px 15px;border-radius:8px;font-size:0.9em;cursor:pointer;margin-bottom:10px}
    .bolum{background:rgba(255,255,255,0.08);padding:15px;border-radius:15px;margin-bottom:15px}
    .bolum h2{font-size:1.1em;margin:0 0 12px 0;opacity:0.95}
    label{display:block;font-size:0.85em;opacity:0.85;margin:8px 0 4px 0}
    input,select{width:100%;padding:10px;border-radius:8px;border:none;font-size:1em;box-sizing:border-box;background:rgba(255,255,255,0.95);color:#000}
    .buton{width:100%;padding:14px;border-radius:10px;border:none;font-weight:bold;font-size:1.05em;cursor:pointer;margin-top:10px}
    .btn-mor{background:#8b5cf6;color:#fff}
    .btn-mor:hover{background:#7c3aed}
    .btn-mavi{background:#3b82f6;color:#fff}
    .btn-mavi:hover{background:#2563eb}
    .btn-gri{background:#64748b;color:#fff}
    .btn-gri:hover{background:#475569}
    .tarih-butonlar{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
    .tarih-butonlar button{flex:1;min-width:calc(33% - 6px);padding:10px;border-radius:8px;border:none;font-weight:bold;font-size:0.85em;cursor:pointer;background:rgba(255,255,255,0.15);color:#fff}
    .tarih-butonlar button:hover{background:rgba(255,255,255,0.25)}
    .tarih-butonlar button.aktif{background:#4ade80;color:#064e3b}
    .hata{background:#fbbf24;color:#000;padding:10px;border-radius:10px;margin-top:10px;font-size:0.85em;display:none;word-break:break-word}
    .basari{background:#4ade80;color:#064e3b;padding:10px;border-radius:10px;margin-top:10px;font-size:0.85em;display:none;text-align:center;font-weight:bold}
    .ilerleme{text-align:center;padding:20px;display:none}
    .ilerleme .spinner{display:inline-block;width:30px;height:30px;border:4px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:10px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .ilerleme-bar{width:100%;height:12px;background:rgba(255,255,255,0.15);border-radius:6px;overflow:hidden;margin-top:12px}
    .ilerleme-dolgu{height:100%;background:linear-gradient(90deg,#4ade80,#22c55e);border-radius:6px;width:0%;transition:width 0.5s}
    .kart{background:rgba(255,255,255,0.08);padding:15px;border-radius:12px;margin-bottom:12px;border-left:6px solid #64748b}
    .kart.one-cikan{border-left-color:#4ade80;background:rgba(74,222,128,0.1)}
    .kart.normal{border-left-color:#fbbf24;background:rgba(251,191,36,0.08)}
    .kart.degersiz{border-left-color:#ef4444;background:rgba(239,68,68,0.08)}
    .kart .baslik{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px}
    .kart .mac{font-size:1.05em;font-weight:bold}
    .kart .lig{font-size:0.8em;opacity:0.8}
    .kart .durum-etiket{font-size:0.75em;padding:3px 10px;border-radius:10px;font-weight:bold}
    .kart.one-cikan .durum-etiket{background:#4ade80;color:#064e3b}
    .kart.normal .durum-etiket{background:#fbbf24;color:#000}
    .kart.degersiz .durum-etiket{background:#ef4444;color:#fff}
    .ajan-satir{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.08);font-size:0.88em}
    .ajan-satir .ajan-adi{font-weight:bold;min-width:75px}
    .ajan-satir .ajan-tahmin{flex:1;padding:0 8px}
    .ajan-satir .ajan-guven{font-weight:bold;color:#4ade80;min-width:45px;text-align:right}
    .kart .gerekce{font-size:0.78em;opacity:0.75;margin:4px 0 0 0;font-style:italic}
    .kart .ortak{background:rgba(74,222,128,0.15);padding:8px 12px;border-radius:8px;margin-top:10px;font-size:0.9em}
    .kart .ortak strong{color:#4ade80}
    .filtreler{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .filtreler label{display:inline-block;margin:0}
    .filtreler input[type="checkbox"]{width:auto;margin-right:6px}
    .slider-kapsayici{margin-top:12px}
    .slider-kapsayici input[type="range"]{width:100%}
    .slider-deger{text-align:center;font-size:0.85em;opacity:0.8;margin-top:4px}
    .bos{opacity:0.6;text-align:center;padding:15px;font-size:0.9em}
    .son-analiz{background:rgba(255,255,255,0.06);padding:10px;border-radius:10px;margin-bottom:8px;font-size:0.85em}
    .son-analiz .tarih{opacity:0.75;font-size:0.8em}
    .son-analiz .ozet{margin-top:4px}
    .buton-grubu{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  </style>
</head>
<body>
  <div class="kapsayici">
    <button class="geri" onclick="window.history.back()">← Ana Sayfa</button>
    <h1>🌍 Bülten Analizi</h1>

    <div class="bolum">
      <h2>📅 Analiz Ayarları</h2>
      <label>Ne zaman?</label>
      <div class="tarih-butonlar">
        <button id="btnBugun" class="aktif" onclick="tarihSec('bugun')">Bugün</button>
        <button id="btnYarin" onclick="tarihSec('yarin')">Yarın</button>
        <button id="btnHafta" onclick="tarihSec('hafta')">Bu Hafta</button>
      </div>

      <label style="margin-top:12px;">📆 Belirli Tarih</label>
      <select id="tarihSecici" onchange="tarihSec('ozel')">
        <option value="">Seçiniz...</option>
      </select>

      <label>Kaç maç analiz edilsin?</label>
      <select id="macSayisi">
        <option value="5" selected>5 maç</option>
        <option value="10">10 maç</option>
        <option value="15">15 maç</option>
        <option value="20">20 maç</option>
      </select>

      <div class="buton-grubu">
        <button id="analizBtnAI" class="buton btn-mor" onclick="analizBaslat('ai')">🌐 AI Web Araması ile Analiz Et</button>
        <button id="analizBtnFB" class="buton btn-mavi" onclick="analizBaslat('football')">⚽ Fikstür API ile Analiz Et</button>
      </div>

      <div id="debug" class="hata"></div>
      <div id="basari" class="basari"></div>
    </div>

    <!-- İLERLEME -->
    <div id="ilerlemeBolum" class="bolum ilerleme">
      <div class="spinner"></div>
      <div id="ilerlemeMetin" style="font-weight:bold;">Analiz Başlatılıyor...</div>
      <div id="ilerlemeDetay" style="font-size:0.8em; opacity:0.8; margin-top:4px;">Lütfen bekleyin</div>
      <div class="ilerleme-bar">
        <div id="ilerlemeDolgu" class="ilerleme-dolgu"></div>
      </div>
    </div>

    <!-- FİLTRELER -->
    <div class="bolum" id="filtreBolum" style="display:none">
      <h2>🔍 Filtreler</h2>
      <div class="filtreler">
        <label><input type="checkbox" id="filtreOneCikan" onchange="kartlariFiltrele()">Sadece öne çıkanlar</label>
      </div>
      <div class="slider-kapsayici">
        <label>Minimum güven: <span id="sliderDeger">0</span>%</label>
        <input type="range" id="minGuven" min="0" max="100" value="0" oninput="kartlariFiltrele()">
      </div>
    </div>

    <!-- SONUÇLAR -->
    <div class="bolum" id="sonucBolum" style="display:none">
      <h2>📊 Analiz Sonuçları (<span id="sonucSayisi">0</span> maç)</h2>
      <div id="kartListesi"></div>
      <button class="buton btn-gri" onclick="sonuclariTemizle()">🗑 Sonuçları Temizle</button>
    </div>

    <!-- SON ANALİZLER -->
    <div class="bolum">
      <h2>📜 Son Analizler</h2>
      <div id="sonAnalizler">Yükleniyor...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://bwdoiltmkrqfxqknedih.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ3ZG9pbHRta3JxZnhxa25lZGloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NTkzNjcsImV4cCI6MjEwNjAzNTM2N30.mx1O66LItD6Q6ED1Z75YzGXW7ijSDUVAl9R2df4Km8o"; 
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let aiAnahtarlari = { gemini: null, groq: null, football: null };
    let mevcutTarih = null;
    let mevcutTarihTipi = "bugun";
    let tumKartlar = [];
    let mevcutKullanici = null;

    const MARKET_LISTESI = [
      "Maç Sonucu (1X2)", "Çifte Şans", "Çifte Şans ve Toplam Alt/Üst", "Handikap", 
      "Herhangi Bir Yarıyı Kazanır", "Geriye Düşüp Berabere Biter", "Geriden Gelip Kazanır", 
      "Toplam Gol Üst/Alt", "KG Var/Yok", "Toplam Gol Aralığı", "Ev Gol Aralığı", 
      "Dep Gol Aralığı", "Ev Gol Yer", "Dep Gol Yer", "Gol Yemeden Kazanır", 
      "İlk Yarı Sonucu", "İkinci Yarı Sonucu", "İlk Yarı Gol", "İkinci Yarı Gol"
    ];

    function hataGoster(m) {
      const el = document.getElementById("debug");
      el.style.display = "block";
      el.textContent = "HATA: " + m;
    }

    function basariGoster(m) {
      const el = document.getElementById("basari");
      el.style.display = "block";
      el.textContent = m;
      setTimeout(() => { el.style.display = "none"; }, 4000);
    }

    function tarihSeciciDoldur() {
      const sel = document.getElementById("tarihSecici");
      if (!sel) return;
      sel.innerHTML = '<option value="">Seçiniz...</option>';
      const bugun = new Date();
      for (let i = 0; i < 30; i++) {
        const d = new Date(bugun);
        d.setDate(bugun.getDate() + i);
        const opt = document.createElement("option");
        const gun = String(d.getDate()).padStart(2, "0");
        const ay = String(d.getMonth() + 1).padStart(2, "0");
        const yil = d.getFullYear();
        opt.value = yil + "-" + ay + "-" + gun;
        opt.textContent = gun + "." + ay + "." + yil;
        sel.appendChild(opt);
      }
    }

    async function kontrol() {
      tarihSeciciDoldur();

      try {
        const { data: { session } } = await client.auth.getSession();
        if (session) {
          mevcutKullanici = session.user.id;
        }
      } catch (e) {
        console.warn("Oturum kontrol hatası:", e);
      }

      await aiAnahtarlariniYukle();
      await sonAnalizleriYukle();
    }

    async function aiAnahtarlariniYukle() {
      try {
        const { data, error } = await client.from("ai_ayarlar").select("gemini_key, groq_key, football_data_key").limit(1).maybeSingle();
        if (error) {
          console.error("AI Ayarlar çekilemedi:", error);
          return;
        }
        if (data) {
          aiAnahtarlari.gemini = data.gemini_key;
          aiAnahtarlari.groq = data.groq_key;
          aiAnahtarlari.football = data.football_data_key;
        }
      } catch (e) {
        console.error("Anahtar yukleme hatasi:", e);
      }
    }

    function tarihSec(tip) {
      mevcutTarihTipi = tip;
      document.querySelectorAll(".tarih-butonlar button").forEach(b => b.classList.remove("aktif"));
      if (tip === "bugun") document.getElementById("btnBugun").classList.add("aktif");
      if (tip === "yarin") document.getElementById("btnYarin").classList.add("aktif");
      if (tip === "hafta") document.getElementById("btnHafta").classList.add("aktif");
      if (tip === "ozel") {
        mevcutTarih = document.getElementById("tarihSecici").value;
      }
    }

    function tarihFormatYYYYMMDD(offsetGun = 0) {
      const d = new Date();
      if (mevcutTarihTipi === "yarin") {
        d.setDate(d.getDate() + 1);
      } else if (mevcutTarihTipi === "ozel" && mevcutTarih) {
        return mevcutTarih;
      }
      if (offsetGun !== 0) {
        d.setDate(d.getDate() + offsetGun);
      }
      const gun = String(d.getDate()).padStart(2, "0");
      const ay = String(d.getMonth() + 1).padStart(2, "0");
      const yil = d.getFullYear();
      return yil + "-" + ay + "-" + gun;
    }

    async function footballFikstur(macSayisi, tarihBaslangic) {
      if (!aiAnahtarlari.football) {
        throw new Error("Football-data API anahtarı Supabase tablosunda tanımlı değil.");
      }

      let tarihBitis = tarihBaslangic;
      if (mevcutTarihTipi === "hafta") {
        tarihBitis = tarihFormatYYYYMMDD(7);
      }

      const rawUrl = "https://api.football-data.org/v4/matches?dateFrom=" + tarihBaslangic + "&dateTo=" + tarihBitis;
      const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(rawUrl);

      const r = await fetch(proxyUrl, {
        headers: { "X-Auth-Token": aiAnahtarlari.football }
      });

      if (!r.ok) {
        throw new Error("Football API Hatası! Kod: " + r.status);
      }

      const data = await r.json();
      const tumMaclar = [];

      if (data.matches && Array.isArray(data.matches)) {
        for (const m of data.matches) {
          tumMaclar.push({
            ev_sahibi: m.homeTeam?.name || "?",
            deplasman: m.awayTeam?.name || "?",
            lig: m.competition?.name || "Lig",
            saat: m.utcDate ? new Date(m.utcDate).toLocaleTimeString('tr-TR', {hour:'2-digit',minute:'2-digit'}) : "?",
            tarih: m.utcDate
          });
        }
      }

      return tumMaclar.slice(0, macSayisi);
    }

    function promptOlustur(macListesi, macSayisi, tarihMetni, mod) {
      const marketListesiStr = MARKET_LISTESI.join(", ");
      let p = "Sen profesyonel bir futbol bahis ve istatistik analistisin.\n";

      if (mod === "ai") {
        p += "Tarih/Dönem: " + tarihMetni + "\n";
        p += "Görev: Google Arama aracını kullanarak bu tarihteki oynanacak veya öne çıkan en popüler en az " + macSayisi + " futbol maçını bul.\n";
      } else {
        p += "Sana verilen maç listesini analiz et:\n" + JSON.stringify(macListesi) + "\n";
      }

      p += "\nHer maç için Poisson, Elo, Form ve Taktik ajanları gibi 4 farklı yaklaşımla analiz yap.\n";
      p += "Kullanabileceğin bahis marketleri: " + marketListesiStr + "\n\n";
      p += "YANITI SADECE AŞAĞIDAKİ GEÇERLİ JSON FORMATINDA DÖN (Açıklama, markdown veya ekstra metin ekleme):\n";
      p += '{"maclar":[{"ev_sahibi":"...","deplasman":"...","lig":"...","saat":"21:00","ajanlar":{"poisson":{"market":"...","guven":80,"gerekce":"..."},"elo":{"market":"...","guven":75,"gerekce":"..."},"form":{"market":"...","guven":85,"gerekce":"..."},"taktik":{"market":"...","guven":80,"gerekce":"..."}},"ortak_karar":"...","guven":82,"durum":"one_cikan"}]}';

      return p;
    }

    async function geminiCagir(prompt, webAramaAktif = false) {
      const modeller = ["gemini-1.5-flash", "gemini-2.0-flash"];
      
      const body = {
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.2 }
      };

      if (webAramaAktif) {
        body.tools = [{ google_search: {} }];
      }

      for (const model of modeller) {
        try {
          const url = "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent?key=" + aiAnahtarlari.gemini;
          const r = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });

          if (r.ok) {
            const data = await r.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
            if (text) return text;
          }
        } catch (e) {
          console.warn(model + " çağrı hatası:", e);
        }
      }
      throw new Error("Gemini API yanıt vermedi veya anahtar geçersiz.");
    }

    function jsonCikar(text) {
      try {
        let cleaned = text.replace(/```json/g, "").replace(/```/g, "").trim();
        const match = cleaned.match(/\{[\s\S]*\}/);
        let parsed = match ? JSON.parse(match[0]) : JSON.parse(cleaned);

        if (parsed && parsed.maclar && Array.isArray(parsed.maclar)) {
          return parsed;
        }
        return null;
      } catch (e) {
        return null;
      }
    }

    async function analizBaslat(mod) {
      document.getElementById("debug").style.display = "none";
      document.getElementById("ilerlemeBolum").style.display = "block";
      document.getElementById("ilerlemeDolgu").style.width = "15%";
      
      const btnAI = document.getElementById("analizBtnAI");
      const btnFB = document.getElementById("analizBtnFB");
      btnAI.disabled = true;
      btnFB.disabled = true;

      const macSayisi = parseInt(document.getElementById("macSayisi").value);
      const tarihStr = tarihFormatYYYYMMDD();

      if (!aiAnahtarlari.gemini) {
        hataGoster("Gemini API anahtarı Supabase'den çekilemedi.");
        ilerlemeKapat();
        return;
      }

      let macListesi = [];

      if (mod === "football") {
        document.getElementById("ilerlemeMetin").textContent = "Fikstür API'den Çekiliyor...";
        try {
          macListesi = await footballFikstur(macSayisi, tarihStr);
          if (!macListesi || macListesi.length === 0) {
            hataGoster("Seçilen tarihte (" + tarihStr + ") fikstür bulunamadı.");
            ilerlemeKapat();
            return;
          }
        } catch (e) {
          hataGoster("Fikstür Hatası: " + e.message);
          ilerlemeKapat();
          return;
        }
      }

      document.getElementById("ilerlemeMetin").textContent = "AI Analizleri Üretiliyor...";
      document.getElementById("ilerlemeDolgu").style.width = "55%";

      try {
        const prompt = promptOlustur(macListesi, macSayisi, tarihStr, mod);
        const webAramaAktif = (mod === "ai");
        const yanit = await geminiCagir(prompt, webAramaAktif);
        const json = jsonCikar(yanit);

        if (json && json.maclar) {
          tumKartlar = json.maclar;
          document.getElementById("ilerlemeDolgu").style.width = "100%";
          kartlariGoster();
          document.getElementById("filtreBolum").style.display = "block";
          document.getElementById("sonucBolum").style.display = "block";
          document.getElementById("sonucSayisi").textContent = tumKartlar.length;
          await analizKaydet(tarihStr, tumKartlar.length);
          await sonAnalizleriYukle();
        } else {
          hataGoster("AI yanıt üretti ancak veriler JSON formatına ayrıştırılamadı.");
        }
      } catch (e) {
        hataGoster("Analiz Hatası: " + e.message);
      } finally {
        ilerlemeKapat();
      }
    }

    function ilerlemeKapat() {
      document.getElementById("analizBtnAI").disabled = false;
      document.getElementById("analizBtnFB").disabled = false;
      setTimeout(() => { document.getElementById("ilerlemeBolum").style.display = "none"; }, 800);
    }

    function kartlariGoster() {
      const filtreOne = document.getElementById("filtreOneCikan").checked;
      const minGuven = parseFloat(document.getElementById("minGuven").value) || 0;
      document.getElementById("sliderDeger").textContent = minGuven;

      let gosterilecek = tumKartlar.filter(m => {
        if (filtreOne && m.durum !== "one_cikan") return false;
        if ((m.guven || 0) < minGuven) return false;
        return true;
      });

      const el = document.getElementById("kartListesi");
      if (gosterilecek.length === 0) {
        el.innerHTML = '<div class="bos">Filtrelere uygun maç bulunamadı.</div>';
        return;
      }

      el.innerHTML = gosterilecek.map(m => {
        const durumEtiket = m.durum === "one_cikan" ? "🎯 ÖNE ÇIKAN" : (m.durum === "normal" ? "⚡ Normal" : "❌ Değersiz");
        const ajanlar = m.ajanlar || {};
        const ajanSatirlari = ["poisson", "elo", "form", "taktik"].map(a => {
          const isim = {poisson:"📊 Poisson", elo:"📈 Elo", form:"🔥 Form", taktik:"🎭 Taktik"}[a];
          const aj = ajanlar[a] || {};
          return '<div class="ajan-satir">' +
            '<span class="ajan-adi">' + isim + '</span>' +
            '<span class="ajan-tahmin">' + (aj.market || "-") + '</span>' +
            '<span class="ajan-guven">%' + (aj.guven || 0) + '</span>' +
            '</div>' +
            (aj.gerekce ? '<div class="gerekce">' + aj.gerekce + '</div>' : '');
        }).join("");

        return '<div class="kart ' + (m.durum || "normal") + '">' +
          '<div class="baslik">' +
          '<div><div class="mac">' + (m.ev_sahibi || "?") + ' - ' + (m.deplasman || "?") + '</div>' +
          '<div class="lig">' + (m.lig || "Lig") + ' | ' + (m.saat || "") + '</div></div>' +
          '<span class="durum-etiket">' + durumEtiket + '</span>' +
          '</div>' + ajanSatirlari +
          '<div class="ortak"><strong>Ortak Karar:</strong> ' + (m.ortak_karar || "-") + ' (%' + (m.guven || 0) + ')</div>' +
          '</div>';
      }).join("");
    }

    function kartlariFiltrele() { kartlariGoster(); }

    function sonuclariTemizle() {
      tumKartlar = [];
      document.getElementById("filtreBolum").style.display = "none";
      document.getElementById("sonucBolum").style.display = "none";
      basariGoster("Sonuçlar temizlendi.");
    }

    async function analizKaydet(tarih, sayi) {
      if (!mevcutKullanici) return;
      const oneCikan = tumKartlar.filter(m => m.durum === "one_cikan").length;
      const normal = tumKartlar.filter(m => m.durum === "normal").length;
      const degersiz = tumKartlar.filter(m => m.durum === "degersiz").length;
      const ozet = oneCikan + " öne çıkan, " + normal + " normal, " + degersiz + " değersiz";

      try {
        await client.from("bulten_analizleri").insert({
          hedef_tarih: tarih,
          mac_sayisi: sayi,
          one_cikan_sayisi: oneCikan,
          normal_sayisi: normal,
          degersiz_sayisi: degersiz,
          ai_model: "gemini",
          ham_yanit: JSON.stringify(tumKartlar),
          ozet: ozet,
          created_by: mevcutKullanici
        });
        basariGoster("Analiz kaydedildi: " + ozet);
      } catch (e) {
        console.warn("Analiz veritabanına kaydedilemedi:", e);
      }
    }

    async function sonAnalizleriYukle() {
      const el = document.getElementById("sonAnalizler");
      try {
        const { data, error } = await client.from("bulten_analizleri")
          .select("*")
          .order("created_at", { ascending: false })
          .limit(5);

        if (error || !data || data.length === 0) {
          el.innerHTML = '<div class="bos">Henüz yapılmış analiz yok.</div>';
          return;
        }

        el.innerHTML = data.map(a => {
          const tarih = new Date(a.created_at).toLocaleString('tr-TR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
          return '<div class="son-analiz">' +
            '<div class="tarih">' + tarih + ' | Hedef: ' + (a.hedef_tarih || "-") + '</div>' +
            '<div class="ozet">' + (a.ozet || "-") + '</div>' +
            '</div>';
        }).join("");
      } catch (e) {
        el.innerHTML = '<div class="bos">Henüz yapılmış analiz yok.</div>';
      }
    }

    // Uygulama Başlat
    kontrol();
  </script>
</body>
</html>
