<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mavidunya - Giriş</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#1e3c72,#2a5298);color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}
.card{background:rgba(255,255,255,0.1);padding:40px;border-radius:20px;max-width:400px;width:100%}
h1{text-align:center;font-size:2em;margin-bottom:30px}
label{display:block;margin-bottom:5px;font-size:0.9em;opacity:0.9}
input{width:100%;padding:12px;border-radius:10px;border:none;margin-bottom:15px;font-size:1em;box-sizing:border-box}
button{width:100%;padding:14px;border-radius:10px;border:none;background:#4ade80;color:#064e3b;font-weight:bold;font-size:1.1em;cursor:pointer;margin-top:10px}
button:hover{background:#22c55e}
.error{background:#ef4444;color:#fff;padding:10px;border-radius:10px;margin-bottom:15px;font-size:0.9em;display:none}
</style>
</head>
<body>
<div class="card">
<h1>🌊 Mavidunya</h1>
<div class="error" id="errorMsg"></div>
<label>E-posta</label>
<input type="email" id="email" placeholder="ornek@mail.com" autocomplete="email">
<label>Şifre</label>
<input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
<button onclick="girisYap()">Giriş Yap</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
</body>
</html>
